// The gRPC transport for Delve. Status: planned (Mission Critical and Dedicated plans).
//
// The same operations, fields and semantics as the REST API in specs/openapi.yaml; only
// the encoding and the connection differ. One bidirectional stream carries appends for
// many series, with flow control, so a caller can sustain high rates with low tail latency.
//
// Endpoint: {anz,eu,us}.grpc.patternode.com:443, TLS 1.3, HTTP/2.
// Metadata: authorization: Bearer <key or access token>; traceparent optional.
// Times are int64 since the Unix epoch, UTC, in the stream's TimeUnit.

syntax = "proto3";

package patternode.delve.v1;

option go_package = "patternode.com/api/delve/v1;delvev1";
option java_multiple_files = true;
option java_package = "com.patternode.api.delve.v1";

service Delve {
  // A finished series in one call. As POST /v1/segmentations.
  rpc Segment(SegmentRequest) returns (Segmentation);

  // Open, append to and close many streams on one connection. Each client message is
  // answered by exactly one server message with the same correlation_id, in the order the
  // server applied them; appends to one stream are applied in sequence order.
  rpc Append(stream AppendRequest) returns (stream AppendResponse);

  // Events as they happen, resumable from an event id. As the WebSocket subscription.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

enum TimeUnit {
  TIME_UNIT_UNSPECIFIED = 0; // milliseconds
  TIME_UNIT_MS = 1;
  TIME_UNIT_US = 2;
  TIME_UNIT_NS = 3;
}

message Bar {
  int64 open_time = 1;
  int64 close_time = 2;
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
}

message SegmentBox {
  string id = 1;       // h<height>@<open_time>
  string parent = 2;   // empty at the top
  int32 height = 3;
  int32 order = 4;
  int64 bars = 5;
  int64 open_time = 6;
  double open = 7;
  int64 high_time = 8;
  double high = 9;
  int64 low_time = 10;
  double low = 11;
  int64 close_time = 12;
  double close = 13;
  bool provisional = 14;
}

message SegmentRequest {
  string series = 1;
  string profile = 2;   // "standard" or "standard@2026-11"
  TimeUnit time_unit = 3;
  repeated Bar bars = 4;
}

message Segmentation {
  string id = 1;
  string series = 2;
  string profile_version = 3;
  int64 bars = 4;
  int32 depth = 5;
  repeated SegmentBox segments = 6;
}

message AppendRequest {
  string correlation_id = 1;     // yours; echoed on the answer
  oneof op {
    Open open = 2;
    Observation observation = 3;
    Close close = 4;
  }
  message Open {
    string series = 1;
    string profile = 2;
    TimeUnit time_unit = 3;
    Bar bar = 4;                  // sequence 1
  }
  message Observation {
    string stream_id = 1;
    int64 sequence = 2;
    Bar bar = 3;
  }
  message Close {
    string stream_id = 1;
  }
}

message AppendResponse {
  string correlation_id = 1;
  oneof result {
    Appended appended = 2;
    Closed closed = 3;
    Error error = 4;              // the stream carries on after an error for one message
  }
  message Closed {
    string stream_id = 1;
  }
}

message Appended {
  string stream_id = 1;
  string series = 2;
  int64 sequence = 3;
  string profile_version = 4;
  int64 bars = 5;
  Outcome outcome = 6;
  repeated SeriesEvent events = 7;
  repeated SegmentBox right_edge = 8;

  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_STARTED = 1;
    OUTCOME_EXTENDED = 2;
    OUTCOME_SEGMENTED = 3;
  }
}

message SeriesEvent {
  Kind kind = 1;
  int32 level = 2;
  SegmentBox node = 3;
  SegmentBox child = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_EXTENDED = 1;
    KIND_SEGMENTED = 2;
  }
}

message Error {
  string type = 1;                // as error.type in REST
  string error_code = 2;          // as error.details.error_code in REST
  string message = 3;
  int64 expected_sequence = 4;    // with sequence_gap
  string request_id = 5;
}

message SubscribeRequest {
  repeated string types = 1;
  repeated string streams = 2;
  int32 min_level = 3;
  string from = 4;                // an event id to resume after
}

message Event {
  string id = 1;
  string type = 2;
  int64 created_at_us = 3;
  int64 sequence = 4;
  string data_json = 5;           // the event's data, as in REST, JSON encoded
}
