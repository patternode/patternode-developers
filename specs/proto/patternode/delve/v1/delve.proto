// The gRPC transport for Delve. Status: planned (Mission Critical and Dedicated plans).
//
// The same operations, fields and semantics as the REST API in specs/openapi.yaml; only
// the encoding and the connection differ. Patternode keeps nothing between calls: a
// forming series travels with you as its sealed edge, sent with each request and
// returned, renewed, with each answer. One bidirectional stream carries extensions for
// many series, with flow control, for high rates with low tail latency.
//
// Endpoint: {anz,eu,us}.grpc.patternode.com:443, TLS 1.3, HTTP/2.
// Metadata: authorization: Bearer <key or access token>; traceparent optional.
// Times are int64 since the Unix epoch, UTC, in the request's TimeUnit.

syntax = "proto3";

package patternode.delve.v1;

option go_package = "patternode.com/api/delve/v1;delvev1";
option java_multiple_files = true;
option java_package = "com.patternode.api.delve.v1";

service Delve {
  // A finished series in one call. As POST /v1/segmentations.
  rpc Segment(SegmentRequest) returns (Segmentation);

  // Extend forming series. As POST /v1/segmentations/extend, many on one connection: each
  // request is answered by one response with the same correlation_id. Answers for one
  // series come back in the order its requests were sent.
  rpc Extend(stream ExtendRequest) returns (stream ExtendResponse);
}

enum TimeUnit {
  TIME_UNIT_UNSPECIFIED = 0; // milliseconds
  TIME_UNIT_MS = 1;
  TIME_UNIT_US = 2;
  TIME_UNIT_NS = 3;
}

message Bar {
  int64 open_time = 1;
  int64 close_time = 2;
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
}

message SegmentBox {
  string id = 1;       // h<height>@<open_time>
  string parent = 2;   // empty at the top
  int32 height = 3;
  int32 order = 4;
  int64 bars = 5;
  int64 open_time = 6;
  double open = 7;
  int64 high_time = 8;
  double high = 9;
  int64 low_time = 10;
  double low = 11;
  int64 close_time = 12;
  double close = 13;
  bool provisional = 14;
}

message SegmentRequest {
  string series = 1;
  string profile = 2;   // "standard" or "standard@2026-11"
  TimeUnit time_unit = 3;
  repeated Bar bars = 4;
  bool return_edge = 5;
}

message Segmentation {
  string id = 1;
  string series = 2;
  string profile_version = 3;
  int64 bars = 4;
  int32 depth = 5;
  repeated SegmentBox segments = 6;
  bytes edge = 7;                  // with return_edge
  int64 edge_last_close_time = 8;
}

message ExtendRequest {
  string correlation_id = 1;       // yours; echoed on the answer
  string series = 2;
  string profile = 3;
  TimeUnit time_unit = 4;
  bytes edge = 5;                  // empty to start a series
  repeated Bar bars = 6;
}

message ExtendResponse {
  string correlation_id = 1;
  oneof result {
    Extension extension = 2;
    Error error = 3;               // the stream carries on after an error for one request
  }
}

message Extension {
  string series = 1;
  string profile_version = 2;
  int64 bars = 3;
  Outcome outcome = 4;
  repeated SegmentBox closed = 5;      // now final
  repeated SegmentBox right_edge = 6;  // provisional, bottom up
  bytes edge = 7;                      // sealed; store it, send it with the next bars
  int64 edge_last_close_time = 8;

  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_STARTED = 1;
    OUTCOME_EXTENDED = 2;
    OUTCOME_SEGMENTED = 3;
  }
}

message Error {
  string type = 1;                // as error.type in REST
  string error_code = 2;          // as error.details.error_code in REST
  string message = 3;
  string request_id = 4;
}
