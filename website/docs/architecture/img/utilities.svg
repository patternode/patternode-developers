<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="t-utilities d-utilities">
<title id="t-utilities">Reference: utility operations</title>
<desc id="d-utilities">SCADA and the historian sit in the operational zone. A one-way transfer mirrors the historian into the DMZ. The ingest workload in the enterprise zone or your cloud reads the mirror and calls Patternode in the ANZ jurisdiction over private connectivity. Events return to a receiver in the enterprise zone. Nothing connects into the operational zone.</desc>
