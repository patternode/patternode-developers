<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-labelledby="t-context d-context">
<title id="t-context">Patternode from the outside</title>
<desc id="d-context">Your client&#x27;s sources feed your ingest workload, which sends bars under opaque series names to the Patternode API and stores the segments it gets back in your own store. Patternode sends signed events to your event receiver. Your application draws from your store for your users.</desc>
