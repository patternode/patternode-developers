<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="t-quant-context d-quant-context">
<title id="t-quant-context">A quant fund with Patternode</title>
<desc id="d-quant-context">Market data and alternative data come from venues and vendors into the fund&#x27;s data platform. Research builds bars, runs jobs over files in the fund&#x27;s storage, and backtests on the segments. The live platform extends each instrument from its stored edge and feeds the signal engine, which sends orders to venues. Risk and compliance read the same stored segments.</desc>
