<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="t-integration d-integration">
<title id="t-integration">Four ways to integrate</title>
<desc id="d-integration">Finished series: one synchronous REST call. Forming series: one append per bar over REST, batched REST or a gRPC stream. Backfill: upload a file, run a job, take the result. Events: webhooks, a WebSocket subscription or your event bus.</desc>
