<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="t-finance d-finance">
<title id="t-finance">Reference: quantitative trading</title>
<desc id="d-finance">Market data reaches a feed handler and a tick store. The live path builds bars and streams them over gRPC to Patternode in the same region, and a subscription returns stream events to the signal engine. The research path uploads Parquet to jobs and stores results for backtests. Both pin the same profile version.</desc>
