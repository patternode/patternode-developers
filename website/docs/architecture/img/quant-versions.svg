<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" role="img" aria-labelledby="t-quant-versions d-quant-versions">
<title id="t-quant-versions">Reproducibility across profile versions</title>
<desc id="d-quant-versions">Profile version 2026-11 is used for the backtest and for live trading. When version 2027-05 is published, the fund re-runs its research on it as jobs and shadows it live beside the old version, then switches. The old version stays served for at least 24 months, so every past result reproduces.</desc>
