<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" role="img" aria-labelledby="t-partner d-partner">
<title id="t-partner">Your side: the reference architecture</title>
<desc id="d-partner">Sources feed a collector and bar builder; the ingest workload calls Patternode with credentials from the key vault and writes segments to the segment store under each client&#x27;s prefix, recording stream ids and sequences in the series registry. The event receiver verifies and queues events for workers. Your application reads the segment store. Observability covers all of it.</desc>
