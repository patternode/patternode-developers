<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-labelledby="t-security d-security">
<title id="t-security">Trust boundaries and what crosses them</title>
<desc id="d-security">Requests cross from your trust boundary over TLS 1.3, optionally private connectivity, to Patternode&#x27;s edge, which checks the key or token, the body hash, the scopes and the quotas before the service sees them. Only bars and an opaque series name cross; segments come back. Events come back signed.</desc>
