<title id="t-products">One API, four products, one foundation</title>
<desc id="d-products">Delve is the foundation: a series in, shards at every level out. Essence (what repeats), Sentinel (what moves) and Foresight (what comes next) are planned and run on Delve. All four share one API, one key and one contract.</desc>
