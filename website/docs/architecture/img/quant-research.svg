<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-labelledby="t-quant-research d-quant-research">
<title id="t-quant-research">Research and backtest</title>
<desc id="d-quant-research">The research platform writes bars to Parquet in its own storage, presigns links, and runs a Patternode job per series. Results land in the fund&#x27;s storage, keyed by profile version, and feed features and backtests. Each series&#x27; edge is kept to hand over to live trading.</desc>
