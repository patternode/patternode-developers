<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-labelledby="t-deployment d-deployment">
<title id="t-deployment">Deployment and resilience</title>
<desc id="d-deployment">Your callers run in one or two regions of your cloud and reach the jurisdiction endpoint over the internet or private connectivity. The endpoint routes to either of Patternode&#x27;s two regions in the jurisdiction, each with its own edge and cells. Stream checkpoints replicate between regions within one second; a regional failover completes within 60 seconds.</desc>
