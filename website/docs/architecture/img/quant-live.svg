<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-labelledby="t-quant-live d-quant-live">
<title id="t-quant-live">Live trading and its latency budget</title>
<desc id="d-quant-live">Market data reaches the feed handler; the bar builder closes bars and keeps each instrument&#x27;s edge in memory and in a durable store. One gRPC connection extends every instrument from its edge; the segments go to the signal engine and on to execution. Below, the latency budget from a bar&#x27;s close to an order, with Patternode&#x27;s share at the edge.</desc>
