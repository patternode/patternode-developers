<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64">
  <!-- Horizontal lockup. Wordmark is lower-case; font falls back to the system stack until a brand face is chosen (DSC-001 D3). -->
  <rect width="64" height="64" rx="12" fill="#1b202c"/>
  <polyline points="8,44 20,30 30,38 44,16 56,24"
            fill="none" stroke="#00b8e6" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="30" r="3.5" fill="#ffffff"/>
  <circle cx="44" cy="16" r="3.5" fill="#ffffff"/>
  <text x="80" y="43" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5" fill="#1b202c">patternode</text>
</svg>
