version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    groups:
      docusaurus:
        patterns: ["@docusaurus/*", "docusaurus-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /terraform/aws/delve-partner
    schedule: { interval: monthly }
