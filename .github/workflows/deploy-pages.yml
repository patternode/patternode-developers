name: deploy-pages

# Builds the site from main and publishes it with GitHub Pages at developers.patternode.com.
# Needs Settings > Pages > Source: GitHub Actions, and the custom domain set there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json }
      - working-directory: website
        run: npm ci && npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://developers.patternode.com' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/build }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
